<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FF5A34">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Plano de Treino</title>
<style>
  :root{
    --bg:#F5F1E8; --surface:#FFFFFF; --surface-2:#ECE6D8; --border:#DCD4C0;
    --text:#201E1B; --text-dim:#726C5E;
    --accent:#FF5A34; --accent-ink:#1A1207;
    --success:#3F9160; --success-bg:#E4F1E6; --success-ink:#F5FFF8;
    --danger:#D9463F; --danger-ink:#FFF6F5;
    --warn:#B8791A; --warn-bg:#F7ECD6;
    --radius:14px;
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131419; --surface:#1C1E25; --surface-2:#262933; --border:#363A46;
      --text:#ECE9E2; --text-dim:#9A9DA8;
      --accent:#FF6B45; --accent-ink:#1A1207;
      --success:#5FC282; --success-bg:#1C3327; --success-ink:#0B1F12;
      --danger:#FF6B66; --danger-ink:#2B0806;
      --warn:#E8B339; --warn-bg:#3A2F14;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131419; --surface:#1C1E25; --surface-2:#262933; --border:#363A46;
    --text:#ECE9E2; --text-dim:#9A9DA8;
    --accent:#FF6B45; --accent-ink:#1A1207;
    --success:#5FC282; --success-bg:#1C3327; --success-ink:#0B1F12;
    --danger:#FF6B66; --danger-ink:#2B0806;
    --warn:#E8B339; --warn-bg:#3A2F14;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F5F1E8; --surface:#FFFFFF; --surface-2:#ECE6D8; --border:#DCD4C0;
    --text:#201E1B; --text-dim:#726C5E;
    --accent:#FF5A34; --accent-ink:#1A1207;
    --success:#3F9160; --success-bg:#E4F1E6; --success-ink:#F5FFF8;
    --danger:#D9463F; --danger-ink:#FFF6F5;
    --warn:#B8791A; --warn-bg:#F7ECD6;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    min-height:100vh; display:flex; justify-content:center;
  }
  .shell{width:100%; max-width:560px; padding:0 0 96px; position:relative;}

  /* header */
  header.top{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:18px 18px 12px; border-bottom:1px solid var(--border);
  }
  .titlebar{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  h1{
    font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    letter-spacing:-0.01em; font-size:19px; margin:0;
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--text-dim); margin:0 0 2px;
  }
  .info-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    width:28px; height:28px; border-radius:50%; font-family:var(--font-display);
    font-weight:800; cursor:pointer; flex:none; font-size:13px;
  }
  .info-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .header-actions{display:flex; gap:8px; flex:none;}

  /* legend panel */
  .legend{
    margin-top:12px; display:grid; gap:8px; overflow:hidden; max-height:0;
    transition:max-height .25s ease;
  }
  .legend.open{max-height:400px;}
  .legend-row{
    display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start;
    background:var(--surface-2); border-radius:10px; padding:8px 10px;
  }
  .legend-tag{
    font-family:var(--font-mono); font-weight:700; font-size:12px;
    color:var(--accent); border:1px solid var(--border); border-radius:6px;
    height:24px; display:flex; align-items:center; justify-content:center;
  }
  .legend-txt b{display:block; font-size:12.5px;}
  .legend-txt span{display:block; font-size:12px; color:var(--text-dim); line-height:1.4;}

  /* cycle card */
  .cycle-card{
    margin:14px 18px 0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px;
  }
  .cycle-strip{display:flex; gap:6px; margin-bottom:12px;}
  .cycle-col{flex:1; display:flex; flex-direction:column; gap:3px;}
  .cycle-date{
    font-family:var(--font-mono); font-size:9px; font-weight:700; text-align:center;
    color:var(--success); min-height:11px; line-height:11px;
  }
  .cycle-pill{
    flex:1; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px;
    font-weight:700; padding:7px 0; border-radius:8px; background:var(--surface-2);
    color:var(--text-dim); border:2px solid transparent;
  }
  .cycle-pill.done{color:var(--success); background:var(--success-bg);}
  .cycle-pill.today{border-color:var(--accent); color:var(--accent);}
  .cycle-pill.today.done{border-color:var(--success); color:var(--success);}
  .cycle-msg{font-size:13px; color:var(--text-dim); margin:0 0 10px;}
  .cycle-msg b{color:var(--text);}
  .btn{
    font-family:var(--font-display); font-weight:700; font-size:13px;
    letter-spacing:0.01em; border:none; border-radius:10px; padding:11px 14px;
    cursor:pointer; width:100%;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-confirm{background:var(--success); color:var(--success-ink);}
  .btn-danger{background:var(--danger); color:var(--danger-ink);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}

  /* trackers */
  .trackers{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 18px 0;}
  .tracker{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; display:flex; flex-direction:column; gap:6px;
  }
  .tracker h3{font-size:12px; margin:0; font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.02em;}
  .tracker p{font-size:11.5px; color:var(--text-dim); margin:0; line-height:1.4;}
  .tracker-row{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .tracker-count{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:15px; font-weight:700;}
  .stepper{display:flex; gap:6px;}
  .stepper button{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-family:var(--font-mono); font-size:14px; cursor:pointer;
  }
  .tracker-dots{display:flex; gap:4px; margin-top:2px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--border);}
  .dot.on{background:var(--success);}

  /* tabs */
  .tabs{
    display:flex; gap:6px; margin:16px 18px 0; position:sticky; top:64px; z-index:15;
    background:var(--bg); padding:6px 0;
  }
  .tab{
    flex:1; padding:9px 0; text-align:center; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); font-family:var(--font-mono); font-weight:700; font-size:13px;
    color:var(--text-dim); cursor:pointer;
  }
  .tab.active{background:var(--text); color:var(--bg); border-color:var(--text);}

  .day-heading{margin:14px 18px 4px; display:flex; align-items:baseline; gap:8px;}
  .day-heading h2{font-family:var(--font-display); text-transform:uppercase; font-size:15px; margin:0; letter-spacing:0.01em;}
  .day-heading span{font-size:11px; color:var(--text-dim); font-family:var(--font-mono);}

  /* exercise cards */
  .exlist{display:grid; gap:10px; margin:8px 18px 0;}
  .ex-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:border-color .2s ease;}
  .ex-card.complete{border-color:var(--success);}
  .ex-card.complete .ex-head{background:var(--success-bg);}
  .ex-card.complete .ex-num, .ex-card.complete .ex-name{color:var(--success);}
  .ex-head{
    width:100%; text-align:left; background:none; border:none; padding:12px 14px;
    display:flex; align-items:center; gap:10px; cursor:pointer; color:var(--text);
    transition:background-color .2s ease;
  }
  .ex-num{
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim); width:18px; flex:none;
  }
  .ex-name{flex:1; font-size:14px; font-weight:600; line-height:1.3;}
  .ex-meta{display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex:none;}
  .ex-sets-n{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .ex-rest{font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:700;}
  .chev{color:var(--text-dim); flex:none; transition:transform .15s ease; font-size:11px;}
  .ex-card.open .chev{transform:rotate(180deg);}
  .ex-body{max-height:0; overflow:hidden; transition:max-height .2s ease;}
  .ex-card.open .ex-body{max-height:600px;}
  .ex-body-in{padding:0 14px 14px; display:grid; gap:10px;}
  .reps-line{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); background:var(--surface-2); border-radius:8px; padding:8px 10px;}
  .method-line{font-size:12px; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:8px 10px; line-height:1.4;}
  .setrow{display:grid; grid-template-columns:22px 34px 1fr 1fr; gap:8px; align-items:center;}
  .setrow input[type=checkbox]{
    width:20px; height:20px; accent-color:var(--success); cursor:pointer;
  }
  .settag{
    font-family:var(--font-mono); font-size:11px; font-weight:700; text-align:center;
    border:1px solid var(--border); border-radius:6px; padding:4px 0; color:var(--text-dim);
  }
  .settag.T{color:var(--accent); border-color:var(--accent);}
  .field{position:relative;}
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 8px 8px 8px; font-family:var(--font-mono); font-size:13px; color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .field label{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:10px;
    color:var(--text-dim); pointer-events:none;
  }
  .field input{padding-right:26px;}
  .timer-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:9px; font-family:var(--font-mono); font-size:12.5px; color:var(--text); cursor:pointer;
  }
  .timer-btn:active{background:var(--border);}

  /* history view */
  .hist-topbar{margin:14px 18px 0;}
  .hist-back{
    background:none; border:none; color:var(--text-dim); font-family:var(--font-mono);
    font-size:12.5px; cursor:pointer; padding:0;
  }
  .hist-subtabs{display:flex; gap:6px; margin:14px 18px 0;}
  .hist-subtab{
    flex:1; padding:8px 0; text-align:center; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); font-family:var(--font-mono); font-weight:700; font-size:12px;
    color:var(--text-dim); cursor:pointer;
  }
  .hist-subtab.active{background:var(--text); color:var(--bg); border-color:var(--text);}
  .hist-controls{margin:14px 18px 0; display:grid; gap:10px;}
  .hist-select{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-family:var(--font-body); font-size:13px; color:var(--text);
  }
  .hist-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .hist-chip{
    font-family:var(--font-mono); font-size:11px; font-weight:700; padding:6px 10px; border-radius:20px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer;
  }
  .hist-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .hist-range{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
  .hist-range input[type=date]{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 8px; font-family:var(--font-mono); font-size:12px; color:var(--text);
  }
  .hist-chart-wrap{
    margin:14px 18px 0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px;
  }
  .hist-chart-empty{font-size:12px; color:var(--text-dim); text-align:center; margin:20px 0; display:none;}
  #histChart{width:100%; display:block;}
  .hist-list{margin:12px 18px 0; display:grid; gap:8px;}
  .hist-day{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .hist-day-date{
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:6px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .hist-day-sets{display:flex; gap:8px; flex-wrap:wrap;}
  .hist-set-chip{
    font-family:var(--font-mono); font-size:12px; background:var(--surface-2); border-radius:8px;
    padding:5px 9px; display:flex; gap:6px; align-items:center;
  }
  .hist-set-chip b{color:var(--accent);}

  #histGeneralView{display:grid; gap:12px; margin:14px 18px 0;}
  #histGeneralView[hidden]{display:none;}
  #histGeneralView .hist-chart-wrap{margin:0;}
  .hist-card-title{
    font-family:var(--font-display); text-transform:uppercase; font-size:11.5px;
    letter-spacing:0.03em; margin:0 0 10px; color:var(--text-dim);
  }
  .hist-stat-line{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin:8px 0 0;}
  .hist-progress-big{font-family:var(--font-display); font-weight:800; font-size:36px; color:var(--accent);}
  .hist-progress-bar{height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:10px;}
  .hist-progress-fill{height:100%; background:var(--accent); width:0%; transition:width .3s ease;}

  .foot-note{margin:22px 18px 0; font-size:11.5px; color:var(--text-dim); line-height:1.5;}
  .foot-note button{
    background:none; border:none; color:var(--text-dim); text-decoration:underline;
    font-size:11.5px; cursor:pointer; padding:0; font-family:var(--font-body);
  }

  /* bottom timer bar */
  .timerbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center; transform:translateY(120%); transition:transform .25s ease;
  }
  .timerbar.show{transform:translateY(0);}
  .timerbar-in{
    width:100%; max-width:560px; margin:0 12px 12px; background:var(--text); color:var(--bg);
    border-radius:14px; padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .timerbar-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .timerbar-name{font-size:12px; opacity:.75;}
  .timerbar-time{font-family:var(--font-mono); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
  .timerbar-bar{height:4px; background:rgba(128,128,128,.35); border-radius:2px; overflow:hidden; margin-bottom:10px;}
  .timerbar-fill{height:100%; background:var(--accent); width:100%; transition:width 1s linear;}
  .timerbar-actions{display:flex; gap:8px;}
  .timerbar-actions button{
    flex:1; font-family:var(--font-mono); font-size:12px; font-weight:700; padding:8px 0;
    border-radius:8px; border:1px solid rgba(128,128,128,.4); background:transparent; color:var(--bg); cursor:pointer;
  }

  .cycle-actions{display:flex; gap:8px; align-items:stretch;}
  .cycle-actions .btn{flex:1; width:auto;}
  .btn-side{
    flex:0 0 auto; font-family:var(--font-display); font-weight:700; font-size:12px;
    padding:0 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-dim); cursor:pointer; white-space:nowrap;
  }
  .btn-side:active{background:var(--border);}

  @media (prefers-reduced-motion: reduce){
    .legend, .ex-body, .timerbar, .chev{transition:none;}
  }
</style>

<div class="app">
  <div class="shell">
    <header class="top">
      <div class="titlebar">
        <div>
          <p class="eyebrow">Ciclo A · B · C · off · D · E · off</p>
          <h1>Plano de Treino</h1>
        </div>
        <div class="header-actions">
          <button class="info-btn" id="historyToggle" aria-label="Ver histórico de evolução" title="Histórico de evolução">↗</button>
          <button class="info-btn" id="legendToggle" aria-expanded="false" aria-controls="legendPanel">i</button>
        </div>
      </div>
      <div class="legend" id="legendPanel"></div>
    </header>

    <div id="trainView">
      <section class="cycle-card" id="cycleCard"></section>

      <section class="trackers" id="trackers"></section>

      <nav class="tabs" id="tabs"></nav>

      <div class="day-heading" id="dayHeading"></div>
      <section class="exlist" id="exList"></section>
    </div>

    <section id="historyView" hidden>
      <div class="hist-topbar">
        <button class="hist-back" id="histBack">← Voltar ao treino</button>
      </div>
      <div class="hist-subtabs" id="histSubtabs">
        <button class="hist-subtab active" data-mode="exercise">Por exercício</button>
        <button class="hist-subtab" data-mode="general">Geral</button>
      </div>
      <div class="hist-controls">
        <select class="hist-select" id="histExercise"></select>
        <div class="hist-chips" id="histChips"></div>
        <div class="hist-range">
          <input type="date" id="histStart" aria-label="De">
          <span>até</span>
          <input type="date" id="histEnd" aria-label="Até">
        </div>
      </div>

      <div id="histExerciseView">
        <div class="hist-chart-wrap">
          <canvas id="histChart" height="140"></canvas>
          <p class="hist-chart-empty" id="histChartEmpty"></p>
        </div>
        <div class="hist-list" id="histList"></div>
      </div>

      <div id="histGeneralView" hidden>
        <div class="hist-chart-wrap">
          <h3 class="hist-card-title">Volume total por sessão</h3>
          <canvas id="histVolumeChart" height="120"></canvas>
          <p class="hist-chart-empty" id="histVolumeEmpty"></p>
        </div>
        <div class="hist-chart-wrap">
          <h3 class="hist-card-title">Frequência de treinos</h3>
          <canvas id="histFreqChart" height="120"></canvas>
          <p class="hist-chart-empty" id="histFreqEmpty"></p>
          <p class="hist-stat-line" id="histFreqStat"></p>
        </div>
        <div class="hist-chart-wrap">
          <h3 class="hist-card-title">Progressão de carga</h3>
          <div class="hist-progress-big" id="histProgressBig">—</div>
          <p class="hist-stat-line" id="histProgressStat"></p>
          <div class="hist-progress-bar"><div class="hist-progress-fill" id="histProgressFill"></div></div>
        </div>
      </div>
    </section>

    <p class="foot-note">Os dados (cargas, marcações, ciclo e histórico) ficam salvos apenas neste navegador. <button id="resetAll">Apagar todos os dados salvos</button></p>
  </div>

  <div class="timerbar" id="timerBar">
    <div class="timerbar-in">
      <div class="timerbar-top">
        <span class="timerbar-name" id="timerName">Descanso</span>
        <span class="timerbar-time" id="timerTime">00:00</span>
      </div>
      <div class="timerbar-bar"><div class="timerbar-fill" id="timerFill"></div></div>
      <div class="timerbar-actions">
        <button id="timerPause">Pausar</button>
        <button id="timerSkip">Pular</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var LEGEND = [
    {tag:'A', name:'Aquecimento', desc:'Movimento um pouco mais rápido, carga leve e mais repetições.'},
    {tag:'P', name:'Preparo', desc:'Carga perto da máxima, sem chegar à falha, movimento controlado.'},
    {tag:'T', name:'Trabalho', desc:'Carga máxima para as repetições pedidas — até a falha.'},
    {tag:'P.C', name:'Progressão de carga', desc:'Aumente a carga em relação ao valor salvo na última sessão.'}
  ];

  var SEQUENCE = ['A','B','C','OFF','D','E','OFF'];

  var DAYS = {
    A: {title:'Upper', exercises:[
      {name:'Puxada aberta pegada pronada', series:'1 A / 1 P / 2 T', reps:'12 a 15 / 4 a 6 / 2 de 8 a 10', rest:'02:30'},
      {name:'Remada curvada barra livre', series:'1 P / 2 T', reps:'4 a 6 / 8 a 10 / 6 a 8', rest:'02:30', method:'P.C'},
      {name:'Supino inclinado máquina', series:'1 A / 1 P / 2 T', reps:'12 a 15 / 4 a 6 / 8 a 10 / 6 a 8', rest:'02:30', method:'P.C'},
      {name:'Crucifixo reto máquina', series:'1 P / 2 T', reps:'4 a 6 / 2 de 8 a 10', rest:'02:30', method:'P.C — pico de contração de 2 segs'},
      {name:'Desenvolvimento halter', series:'3 T', reps:'10 a 12 / 2 de 8 a 10', rest:'01:30', method:'P.C'},

  var EXTRA = {
    abdomen: {label:'Abdômen & panturrilha', detail:'1 exercício, 5 séries. Pode ser feito em dia de folga.', target:2},
    cardio: {label:'Cardio', detail:'30 min de bike ou esteira inclinada, em jejum ou pós-treino.', target:4}
  };

  var STORE_KEY = 'plano-de-treino-v1';

  function defaultState(){
    return {pointer:0, doneThisLap:{}, sets:{}, cardioCount:0, abdomenCount:0, history:[], sessions:[]};
  }
  function loadState(){
    var base = defaultState();
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        parsed.history = parsed.history || [];
        parsed.sessions = parsed.sessions || [];
        return Object.assign(base, parsed);
      }
    }catch(e){}
    return base;
  }
  var state = loadState();
  function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  function expandMethod(m){
    return m.replace(/^P\.C\b/, 'Progressão de carga');
  }

  function parseSets(seriesStr){
    var tags = [];
    seriesStr.split('/').forEach(function(seg){
      var m = seg.trim().match(/^(\d+)\s*([A-Za-z.]+)$/);
      if(m){
        var n = parseInt(m[1],10), tag = m[2].toUpperCase();
        for(var i=0;i<n;i++) tags.push(tag);
      }
    });
    return tags;
  }

  function pad2(n){ return n<10 ? '0'+n : String(n); }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function fmtDatePt(iso){
    var p = iso.split('-');
    return p[2]+'/'+p[1]+'/'+p[0].slice(2);
  }
  function restToSeconds(str){
    var parts = str.split(':').map(Number);
    return parts[0]*60 + parts[1];
  }
  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }

  var activeTab = SEQUENCE[state.pointer] === 'OFF' ? firstNonOffAfter(state.pointer) : SEQUENCE[state.pointer];
  function firstNonOffAfter(idx){
    for(var i=0;i<7;i++){
      var d = SEQUENCE[(idx+i)%7];
      if(d!=='OFF') return d;
    }
    return 'A';
  }

  var legendOpen = false;

    legendOpen = !legendOpen;
    legendPanel.classList.toggle('open', legendOpen);
    this.setAttribute('aria-expanded', String(legendOpen));
  });

  /* ---------- cycle card ---------- */
  function currentSlotSession(){
    if(!state.doneThisLap[state.pointer]) return null;
    for(var i=state.sessions.length-1;i>=0;i--){
      if(state.sessions[i].seqIndex===state.pointer) return state.sessions[i];
    }
    return null;
  }

  function sessionForSlot(seqIndex){
    if(!state.doneThisLap[seqIndex]) return null;
    for(var i=state.sessions.length-1;i>=0;i--){
      if(state.sessions[i].seqIndex===seqIndex) return state.sessions[i];
    }
    return null;
  }
  function fmtDayMonth(iso){
    var p = iso.split('-');
    return p[2]+'/'+p[1];
  }

  function renderCycle(){
    var card = document.getElementById('cycleCard');
    var strip = SEQUENCE.map(function(d,i){
      var cls = 'cycle-pill';
      if(state.doneThisLap[i]) cls += ' done';
      if(i===state.pointer) cls += ' today';
      var slotSession = sessionForSlot(i);
      var dateLabel = slotSession ? fmtDayMonth(slotSession.date) : '';
      return '<div class="cycle-col"><span class="cycle-date">'+dateLabel+'</span><div class="'+cls+'">'+d+'</div></div>';
    }).join('');
    var todayLetter = SEQUENCE[state.pointer];
    var msg = todayLetter==='OFF'
      ? 'Hoje é <b>dia de folga</b> no ciclo. Abdômen/panturrilha pode entrar aqui.'
      : 'Próximo no ciclo: treino <b>'+todayLetter+' — '+DAYS[todayLetter].title+'</b>.';
    var session = currentSlotSession();
    var mainLabel = session
      ? (session.letter==='OFF' ? '↺ Desfazer dia de folga' : '↺ Desfazer treino ('+session.letter+')')
      : (todayLetter==='OFF' ? '✓ Concluir dia de folga' : '✓ Concluir treino ('+todayLetter+')');
    var mainClass = session ? 'btn btn-danger' : 'btn btn-confirm';

    card.innerHTML =
      '<div class="cycle-strip">'+strip+'</div>'+
      '<p class="cycle-msg">'+msg+'</p>'+
      '<div class="cycle-actions">'+
        '<button class="btn-side" id="backBtn">‹ Voltar</button>'+
        '<button class="'+mainClass+'" id="advanceBtn">'+mainLabel+'</button>'+
        '<button class="btn-side" id="skipBtn">Pular ›</button>'+
      '</div>';
    document.getElementById('advanceBtn').addEventListener('click', handleMainAction);
    document.getElementById('backBtn').addEventListener('click', goBackCycle);
    document.getElementById('skipBtn').addEventListener('click', skipCycle);
  }

  function handleMainAction(){
    if(currentSlotSession()) undoSession();
    else concludeSession();
  }

  function concludeSession(){
    var letter = SEQUENCE[state.pointer];
    var seqIndex = state.pointer;
    var doneThisLapBefore = JSON.parse(JSON.stringify(state.doneThisLap));
    var cardioBefore = state.cardioCount, abdomenBefore = state.abdomenCount;
    var session = {date:todayISO(), letter:letter, seqIndex:seqIndex};

    state.doneThisLap[seqIndex] = true;
    if(letter !== 'OFF'){
      var day = DAYS[letter];
      Object.keys(state.sets).forEach(function(k){
        if(k.indexOf(letter+'-')===0){
          var s = state.sets[k];
          if(s.weight || s.reps){
            var parts = k.split('-');
            var exIdx = parseInt(parts[1],10), setIdx = parseInt(parts[2],10);
            var tags = parseSets(day.exercises[exIdx].series);
            state.history.push({date:session.date, day:letter, exIdx:exIdx, setIdx:setIdx, tag:tags[setIdx]||'', weight:s.weight, reps:s.reps});
          }
          s.checked = false;
        }
      });
      if(state.history.length > 5000) state.history = state.history.slice(-5000);
    }

    state.pointer = (state.pointer+1)%7;
    if(state.pointer===0){
      session.wrapped = true;
      session.prevDoneThisLap = doneThisLapBefore;
      session.prevCardio = cardioBefore;
      session.prevAbdomen = abdomenBefore;
      state.doneThisLap = {};
      state.cardioCount = 0;
      state.abdomenCount = 0;
    }

    state.sessions.push(session);
    if(state.sessions.length > 2000) state.sessions = state.sessions.slice(-2000);

    save();
    renderCycle();
    renderTrackers();
    if(letter !== 'OFF') renderDay();
  }

  function undoSession(){
    var target = currentSlotSession();
    if(!target) return;
    var idx = state.sessions.indexOf(target);
    if(idx===-1) return;
    var session = state.sessions[idx];
    state.sessions.splice(idx,1);
    state.history = state.history.filter(function(h){
      return !(h.date===session.date && h.day===session.letter);
    });
    if(session.wrapped){
      state.doneThisLap = session.prevDoneThisLap || {};
      state.cardioCount = session.prevCardio || 0;
      state.abdomenCount = session.prevAbdomen || 0;
    } else {
      delete state.doneThisLap[session.seqIndex];
    }
    state.pointer = session.seqIndex;
    save();
    renderCycle();
    renderTrackers();
    if(session.letter !== 'OFF') renderDay();
  }

  function goBackCycle(){
    state.pointer = (state.pointer+6)%7;
    save();
    renderCycle();
  }

  function skipCycle(){
    state.pointer = (state.pointer+1)%7;
    save();
    renderCycle();
  }

  /* ---------- trackers ---------- */
  function renderTrackers(){
    var el = document.getElementById('trackers');
    el.innerHTML = trackerHtml('cardio', EXTRA.cardio, state.cardioCount) +
                    trackerHtml('abdomen', EXTRA.abdomen, state.abdomenCount);
    ['cardio','abdomen'].forEach(function(key){
      el.querySelector('[data-dec="'+key+'"]').addEventListener('click', function(){ bumpTracker(key,-1); });
      el.querySelector('[data-inc="'+key+'"]').addEventListener('click', function(){ bumpTracker(key,1); });
    });
  }
  function trackerHtml(key, def, count){
    var dots = '';
    for(var i=0;i<def.target;i++) dots += '<span class="dot'+(i<count?' on':'')+'"></span>';
    return '<div class="tracker">'+
      '<h3>'+def.label+'</h3>'+
      '<p>'+def.detail+'</p>'+
      '<div class="tracker-row">'+
        '<span class="tracker-count">'+count+' / '+def.target+'</span>'+
        '<span class="stepper"><button data-dec="'+key+'">−</button><button data-inc="'+key+'">+</button></span>'+
      '</div>'+
      '<div class="tracker-dots">'+dots+'</div>'+
    '</div>';
  }
  function bumpTracker(key, delta){
    var field = key+'Count';
    var max = EXTRA[key].target;
    state[field] = Math.max(0, Math.min(max, state[field]+delta));
    save();
    renderTrackers();
  }

  /* ---------- tabs + exercise list ---------- */
  var DAY_KEYS = ['A','B','C','D','E'];
  function renderTabs(){
    var el = document.getElementById('tabs');
    el.innerHTML = DAY_KEYS.map(function(d){
      return '<button class="tab'+(d===activeTab?' active':'')+'" data-day="'+d+'">'+d+'</button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.tab'), function(btn){
      btn.addEventListener('click', function(){
        activeTab = btn.getAttribute('data-day');
        renderTabs();
        renderDay();
      });
    });
  }

  function setKey(day, exIdx, setIdx){ return day+'-'+exIdx+'-'+setIdx; }
  function getSet(key){ return state.sets[key] || {checked:false, weight:'', reps:''}; }

  function isExerciseComplete(day, exIdx, tags){
    return tags.every(function(_, setIdx){
      var s = state.sets[setKey(day, exIdx, setIdx)];
      return s && s.checked;
    });
  }
  function isDayFullyChecked(day){
    return DAYS[day].exercises.every(function(ex, exIdx){
      return isExerciseComplete(day, exIdx, parseSets(ex.series));
    });
  }

  function renderDay(){
    var day = DAYS[activeTab];
    document.getElementById('dayHeading').innerHTML =
      '<h2>'+activeTab+' — '+day.title+'</h2><span>'+day.exercises.length+' exercícios</span>';

    var list = document.getElementById('exList');
    list.innerHTML = day.exercises.map(function(ex, exIdx){
      var tags = parseSets(ex.series);
      var setsHtml = tags.map(function(tag, setIdx){
        var k = setKey(activeTab, exIdx, setIdx);
        var s = getSet(k);
        var tagCls = tag==='T' ? ' T' : '';
        return '<div class="setrow">'+
          '<input type="checkbox" data-key="'+k+'" class="set-check" '+(s.checked?'checked':'')+' aria-label="Série '+(setIdx+1)+' concluída">'+
          '<div class="settag'+tagCls+'">'+tag+'</div>'+
          '<div class="field"><input type="text" inputmode="decimal" placeholder="—" value="'+escapeAttr(s.weight)+'" data-key="'+k+'" data-field="weight" aria-label="Carga"><label>kg</label></div>'+
          '<div class="field"><input type="text" inputmode="numeric" placeholder="—" value="'+escapeAttr(s.reps)+'" data-key="'+k+'" data-field="reps" aria-label="Repetições"><label>reps</label></div>'+
        '</div>';
      }).join('');

      var completeCls = isExerciseComplete(activeTab, exIdx, tags) ? ' complete' : '';
      return '<div class="ex-card'+completeCls+'" data-idx="'+exIdx+'">'+
        '<button class="ex-head">'+
          '<span class="ex-num">'+(exIdx+1)+'</span>'+
          '<span class="ex-name">'+ex.name+'</span>'+
          '<span class="ex-meta"><span class="ex-sets-n">'+tags.length+' séries</span><span class="ex-rest">'+ex.rest+'</span></span>'+
          '<span class="chev">▾</span>'+
        '</button>'+
        '<div class="ex-body"><div class="ex-body-in">'+
          '<div class="reps-line">Reps alvo: '+ex.reps+'</div>'+
          (ex.method ? '<div class="method-line">'+expandMethod(ex.method)+'</div>' : '')+
          setsHtml+
          '<button class="timer-btn" data-rest="'+restToSeconds(ex.rest)+'" data-name="'+escapeAttr(ex.name)+'">⏱ Iniciar descanso · '+ex.rest+'</button>'+
        '</div></div>'+
      '</div>';
    }).join('');

    Array.prototype.forEach.call(list.querySelectorAll('.ex-head'), function(btn){
      btn.addEventListener('click', function(){
        btn.parentElement.classList.toggle('open');
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.set-check'), function(cb){
      cb.addEventListener('change', function(){
        var k = cb.getAttribute('data-key');
        var s = getSet(k);
        s.checked = cb.checked;
        state.sets[k] = s;
        save();

        var card = cb.closest('.ex-card');
        var exIdx = parseInt(card.getAttribute('data-idx'),10);
        var tags = parseSets(day.exercises[exIdx].series);
        card.classList.toggle('complete', isExerciseComplete(activeTab, exIdx, tags));

        var seqIndex = SEQUENCE.indexOf(activeTab);
        if(activeTab===SEQUENCE[state.pointer] && !state.doneThisLap[seqIndex] && isDayFullyChecked(activeTab)){
          concludeSession();
        }
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.field input'), function(inp){
      inp.addEventListener('input', function(){
        var k = inp.getAttribute('data-key'), f = inp.getAttribute('data-field');
        var s = getSet(k);
        s[f] = inp.value;
        state.sets[k] = s;
        save();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.timer-btn'), function(btn){
      btn.addEventListener('click', function(){
        startTimer(parseInt(btn.getAttribute('data-rest'),10), btn.getAttribute('data-name'));
      });
    });
  }

  function escapeAttr(str){
    return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  /* ---------- rest timer ---------- */
  var timer = {remaining:0, total:0, id:null, running:false};
  var timerBar = document.getElementById('timerBar');
  var timerName = document.getElementById('timerName');
  var timerTime = document.getElementById('timerTime');
  var timerFill = document.getElementById('timerFill');
  var timerPauseBtn = document.getElementById('timerPause');

  function startTimer(seconds, name){
    clearInterval(timer.id);
    timer.remaining = seconds;
    timer.total = seconds;
    timer.running = true;
    timerName.textContent = 'Descanso · '+name;
    updateTimerUI();
    timerBar.classList.add('show');
    timerPauseBtn.textContent = 'Pausar';
    timer.id = setInterval(tick, 1000);
  }
  function tick(){
    timer.remaining--;
    if(timer.remaining<=0){
      timer.remaining = 0;
      updateTimerUI();
      clearInterval(timer.id);
      timer.running = false;
      beep();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      setTimeout(function(){ timerBar.classList.remove('show'); }, 1800);
      return;
    }
    updateTimerUI();
  }
  function updateTimerUI(){
    timerTime.textContent = fmtTime(timer.remaining);
    var pct = timer.total ? (timer.remaining/timer.total*100) : 0;
    timerFill.style.width = pct+'%';
  }
  timerPauseBtn.addEventListener('click', function(){
    if(timer.running){
      clearInterval(timer.id);
      timer.running = false;
      timerPauseBtn.textContent = 'Retomar';
    } else if(timer.remaining>0){
      timer.running = true;
      timerPauseBtn.textContent = 'Pausar';
      timer.id = setInterval(tick, 1000);
    }
  });
  document.getElementById('timerSkip').addEventListener('click', function(){
    clearInterval(timer.id);
    timer.running = false;
    timerBar.classList.remove('show');
  });
  function beep(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+0.55);
    }catch(e){}
  }

  function isoFromDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function presetRange(key){
    var end = new Date();
    var start = new Date();
    if(key==='7d'){ start.setDate(end.getDate()-6); }
    else if(key==='30d'){ start.setDate(end.getDate()-29); }
    else if(key==='month'){ start = new Date(end.getFullYear(), end.getMonth(), 1); }
    else if(key==='year'){ start = new Date(end.getFullYear(), 0, 1); }
    else if(key==='all'){ return {start:'', end:''}; }
    return {start: isoFromDate(start), end: isoFromDate(end)};
  }

      return '<button class="hist-chip'+(p.key===histActivePreset?' active':'')+'" data-preset="'+p.key+'">'+p.label+'</button>';
    }).join('');
    Array.prototype.forEach.call(histChipsEl.querySelectorAll('.hist-chip'), function(btn){
      btn.addEventListener('click', function(){
        histActivePreset = btn.getAttribute('data-preset');
        var r = presetRange(histActivePreset);
        histStartInp.value = r.start;
        histEndInp.value = r.end;
        renderHistChips();
        refreshHistory();
      });
    });
  }

  function openHistory(){
    trainView.hidden = true;
    historyView.hidden = false;
    if(!histExerciseSel.options.length) buildHistExerciseOptions();
    histExerciseSel.value = activeTab+'|0';
    var r = presetRange(histActivePreset);
    histStartInp.value = r.start;
    histEndInp.value = r.end;
    renderHistChips();
    refreshHistory();
  }
  function closeHistory(){
    historyView.hidden = true;
    trainView.hidden = false;
  }
  document.getElementById('historyToggle').addEventListener('click', openHistory);
  document.getElementById('histBack').addEventListener('click', closeHistory);
  histExerciseSel.addEventListener('change', refreshHistory);
  histStartInp.addEventListener('change', function(){ histActivePreset=''; renderHistChips(); refreshHistory(); });
  histEndInp.addEventListener('change', function(){ histActivePreset=''; renderHistChips(); refreshHistory(); });

  Array.prototype.forEach.call(histSubtabsEl.querySelectorAll('.hist-subtab'), function(btn){
    btn.addEventListener('click', function(){
      histMode = btn.getAttribute('data-mode');
      Array.prototype.forEach.call(histSubtabsEl.querySelectorAll('.hist-subtab'), function(b){
        b.classList.toggle('active', b===btn);
      });
      histExerciseSel.style.display = histMode==='exercise' ? '' : 'none';
      histExerciseViewEl.hidden = histMode!=='exercise';
      histGeneralViewEl.hidden = histMode==='exercise';
      refreshHistory();
    });
  });

  function refreshHistory(){
    if(histMode==='exercise') renderExerciseResults();
    else renderGeneralResults();
  }

  function renderExerciseResults(){
    var parts = histExerciseSel.value.split('|');
    var day = parts[0], exIdx = parseInt(parts[1],10);
    var start = histStartInp.value, end = histEndInp.value;
    var entries = state.history.filter(function(h){
      if(h.day!==day || h.exIdx!==exIdx) return false;
      if(start && h.date < start) return false;
      if(end && h.date > end) return false;
      return true;
    });

    var byDate = {};
    entries.forEach(function(h){
      (byDate[h.date] = byDate[h.date] || []).push(h);
    });
    var dates = Object.keys(byDate).sort();

    if(dates.length===0){
      histListEl.innerHTML = '<p class="hist-chart-empty" style="display:block">Sem registros nesse período ainda.</p>';
    } else {
      histListEl.innerHTML = dates.slice().reverse().map(function(dt){
        var sets = byDate[dt].slice().sort(function(a,b){ return a.setIdx-b.setIdx; });
        var chips = sets.map(function(s){
          return '<span class="hist-set-chip"><b>'+(s.tag||'—')+'</b>'+(s.weight?s.weight+'kg':'—')+' · '+(s.reps?s.reps+' reps':'—')+'</span>';
        }).join('');
        return '<div class="hist-day"><div class="hist-day-date">'+fmtDatePt(dt)+'</div><div class="hist-day-sets">'+chips+'</div></div>';
      }).join('');
    }

    var points = dates.map(function(dt){
      var sets = byDate[dt];
      var tSets = sets.filter(function(s){ return s.tag==='T' && parseFloat(s.weight); });
      var pool = tSets.length ? tSets : sets.filter(function(s){ return parseFloat(s.weight); });
      if(!pool.length) return null;
      var w = Math.max.apply(null, pool.map(function(s){ return parseFloat(s.weight); }));
      return {date:dt, value:w};
    }).filter(Boolean);

    drawLineChart(histCanvas, histChartEmpty, points, function(v){ return v+'kg'; });
  }

  function drawLineChart(canvas, emptyEl, points, fmtValue, retries){
    var cssW = canvas.parentElement.clientWidth - 24;
    if(cssW < 40 && (retries||0) < 5){
      requestAnimationFrame(function(){ drawLineChart(canvas, emptyEl, points, fmtValue, (retries||0)+1); });
      return;
    }
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var cssH = 120;
    canvas.width = cssW*dpr;
    canvas.height = cssH*dpr;
    canvas.style.height = cssH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);

    if(points.length < 2){
      canvas.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = points.length===1
        ? 'Só um registro nesse período — volte aqui depois de mais sessões pra ver a evolução.'
        : 'Sem dados suficientes pra montar o gráfico nesse período.';
      return;
    }
    canvas.style.display = 'block';
    emptyEl.style.display = 'none';

    var styles = getComputedStyle(document.documentElement);
    var accent = styles.getPropertyValue('--accent').trim();
    var dim = styles.getPropertyValue('--text-dim').trim();
    var border = styles.getPropertyValue('--border').trim();

    var padL = 4, padR = 4, padT = 20, padB = 20;
    var values = points.map(function(p){ return p.value; });
    var minV = Math.min.apply(null, values);
    var maxV = Math.max.apply(null, values);
    if(minV===maxV){ minV -= 1; maxV += 1; }

    function xAt(i){ return padL + (cssW-padL-padR) * (i/(points.length-1)); }
    function yAt(v){ return padT + (cssH-padT-padB) * (1 - (v-minV)/(maxV-minV)); }

    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, cssH-padB);
    ctx.lineTo(cssW-padR, cssH-padB);
    ctx.stroke();

    ctx.strokeStyle = accent;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    points.forEach(function(p,i){
      var x = xAt(i), y = yAt(p.value);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();

    points.forEach(function(p,i){
      var x = xAt(i), y = yAt(p.value);
      ctx.beginPath();
      ctx.arc(x,y, i===points.length-1?4.5:3, 0, Math.PI*2);
      ctx.fillStyle = accent;
      ctx.fill();
    });

    ctx.fillStyle = dim;
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(fmtDatePt(points[0].date), padL, cssH-4);
    ctx.textAlign = 'right';
    ctx.fillText(fmtDatePt(points[points.length-1].date), cssW-padR, cssH-4);

    ctx.textAlign = 'right';
    ctx.fillStyle = accent;
    ctx.font = 'bold 13px monospace';
    ctx.fillText(fmtValue(points[points.length-1].value), cssW-padR, 14);
  }

  function drawBarChart(canvas, emptyEl, buckets, retries){
    var cssW = canvas.parentElement.clientWidth - 24;
    if(cssW < 40 && (retries||0) < 5){
      requestAnimationFrame(function(){ drawBarChart(canvas, emptyEl, buckets, (retries||0)+1); });
      return;
    }
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var cssH = 120;
    canvas.width = cssW*dpr;
    canvas.height = cssH*dpr;
    canvas.style.height = cssH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);

    if(!buckets.length){
      canvas.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Sem treinos concluídos nesse período ainda.';
      return;
    }
    canvas.style.display = 'block';
    emptyEl.style.display = 'none';

    var styles = getComputedStyle(document.documentElement);
    var accent = styles.getPropertyValue('--accent').trim();
    var dim = styles.getPropertyValue('--text-dim').trim();
    var border = styles.getPropertyValue('--border').trim();

    var padL = 4, padR = 4, padT = 16, padB = 20;
    var maxCount = Math.max.apply(null, buckets.map(function(b){ return b.count; }));
    var n = buckets.length;
    var slot = (cssW-padL-padR)/n;
    var barW = Math.min(28, slot*0.55);

    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, cssH-padB);
    ctx.lineTo(cssW-padR, cssH-padB);
    ctx.stroke();

    buckets.forEach(function(b,i){
      var cx = padL + slot*i + slot/2;
      var h = maxCount ? (b.count/maxCount) * (cssH-padT-padB) : 0;
      var x0 = cx-barW/2, y0 = cssH-padB-h;
      var r = Math.min(4, barW/2, h);
      ctx.fillStyle = accent;
      ctx.beginPath();
      if(h<=0){
        ctx.rect(x0, cssH-padB-1, barW, 1);
      } else {
        ctx.moveTo(x0, cssH-padB);
        ctx.lineTo(x0, y0+r);
        ctx.arcTo(x0, y0, x0+r, y0, r);
        ctx.lineTo(x0+barW-r, y0);
        ctx.arcTo(x0+barW, y0, x0+barW, y0+r, r);
        ctx.lineTo(x0+barW, cssH-padB);
        ctx.closePath();
      }
      ctx.fill();

      ctx.fillStyle = dim;
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(String(b.count), cx, Math.max(y0-6, padT));
    });

    ctx.fillStyle = dim;
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('sem '+fmtDatePt(buckets[0].label), padL, cssH-4);
    ctx.textAlign = 'right';
    ctx.fillText('sem '+fmtDatePt(buckets[buckets.length-1].label), cssW-padR, cssH-4);
  }

  function weekKey(iso){
    var d = new Date(iso+'T00:00:00');
    var day = d.getDay();
    var diffToMonday = (day===0 ? -6 : 1-day);
    d.setDate(d.getDate()+diffToMonday);
    return isoFromDate(d);
  }

  function renderGeneralResults(){
    var start = histStartInp.value, end = histEndInp.value;

    var volByDate = {};
    state.history.forEach(function(h){
      if(start && h.date<start) return;
      if(end && h.date>end) return;
      var w = parseFloat(h.weight), r = parseFloat(h.reps);
      if(!w || !r) return;
      volByDate[h.date] = (volByDate[h.date]||0) + w*r;
    });
    var volPoints = Object.keys(volByDate).sort().map(function(d){
      return {date:d, value:Math.round(volByDate[d])};
    });
    drawLineChart(histVolumeCanvas, histVolumeEmpty, volPoints, function(v){ return v+' kg·rep'; });

    var sessionDates = {};
    state.history.forEach(function(h){
      if(start && h.date<start) return;
      if(end && h.date>end) return;
      sessionDates[h.date] = true;
    });
    var dates = Object.keys(sessionDates).sort();
    var weekBuckets = {};
    dates.forEach(function(d){
      var wk = weekKey(d);
      weekBuckets[wk] = (weekBuckets[wk]||0)+1;
    });
    var weekKeys = Object.keys(weekBuckets).sort();
    var buckets = weekKeys.map(function(k){ return {label:k, count:weekBuckets[k]}; });
    drawBarChart(histFreqCanvas, histFreqEmpty, buckets);
    histFreqStat.textContent = dates.length===0
      ? ''
      : dates.length+' treino'+(dates.length===1?'':'s')+' concluído'+(dates.length===1?'':'s')+' nesse período.';

    var byExercise = {};
    state.history.forEach(function(h){
      if(start && h.date<start) return;
      if(end && h.date>end) return;
      if(!parseFloat(h.weight)) return;
      var key = h.day+'|'+h.exIdx;
      byExercise[key] = byExercise[key] || {};
      byExercise[key][h.date] = Math.max(byExercise[key][h.date]||0, parseFloat(h.weight));
    });
    var total = 0, improved = 0;
    Object.keys(byExercise).forEach(function(key){
      var byDate = byExercise[key];
      var ds = Object.keys(byDate).sort();
      if(ds.length < 2) return;
      total++;
      if(byDate[ds[ds.length-1]] > byDate[ds[0]]) improved++;
    });
    if(total===0){
      histProgressBig.textContent = '—';
      histProgressStat.textContent = 'Sem exercícios com pelo menos duas sessões registradas nesse período ainda.';
      histProgressFill.style.width = '0%';
    } else {
      var pct = Math.round((improved/total)*100);
      histProgressBig.textContent = pct+'%';
      histProgressStat.textContent = improved+' de '+total+' exercícios com carga maior na sessão mais recente do período, em relação à mais antiga do período.';
      histProgressFill.style.width = pct+'%';
    }
  }

  /* ---------- reset ---------- */
  document.getElementById('resetAll').addEventListener('click', function(){
    if(confirm('Apagar todo o histórico de cargas, marcações e o progresso do ciclo salvos neste navegador?')){
      localStorage.removeItem(STORE_KEY);
      state = defaultState();
      activeTab = 'A';
      renderCycle(); renderTrackers(); renderTabs(); renderDay();
      if(!historyView.hidden) refreshHistory();
    }
  });

  /* ---------- init ---------- */
  renderCycle();
  renderTrackers();
  renderTabs();
  renderDay();
})();
</script>
